name: "enterprise_dbt_snowflake_pipeline"
version: "1.0.0"
config-version: 2

profile: "enterprise_dbt_snowflake"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Synthetic FX assumption used by ERP staging (Issue #16) to convert
  # EUR-denominated amounts to USD before the US/EU shard union. This is a
  # fixed illustrative rate for this portfolio project only -- it is NOT a
  # production FX rate, is not sourced from any FX provider or rate table,
  # and does not vary by date. GBP-denominated EU rows have no conversion
  # rate defined here by design and are routed to staging quarantine as an
  # unsupported currency (see docs/data_modeling_decisions.md ADR-002).
  erp_eur_to_usd_rate: 1.10

models:
  enterprise_dbt_snowflake_pipeline:
    staging:
      +materialized: view
    intermediate:
      # Ephemeral: these models exist to reshape/union sources for the marts
      # layer, are never queried directly (by BI tools or ad hoc analysts),
      # and this project's schemas are already ephemeral per PR (see
      # docs/workflow.md) — giving intermediate its own persisted object per
      # PR schema would just be extra Snowflake objects with no consumer.
      # Revisit if an intermediate model ever needs to be tested/debugged
      # in isolation via `dbt show`, where a table materialization is easier
      # to inspect.
      +materialized: ephemeral
    marts:
      +materialized: table
