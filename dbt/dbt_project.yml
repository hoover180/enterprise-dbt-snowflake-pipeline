name: "enterprise_dbt_snowflake_pipeline"
version: "1.0.0"
config-version: 2

profile: "enterprise_dbt_snowflake"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Synthetic FX assumptions used by ERP staging (Issue #16) to convert
  # EUR/GBP-denominated amounts to USD before the US/EU shard union. These
  # are fixed illustrative rates for this portfolio project only -- they
  # are NOT production FX rates, are not sourced from any FX provider or
  # rate table, and do not vary by date (see
  # docs/data_modeling_decisions.md ADR-002).
  erp_eur_to_usd_rate: 1.10
  erp_gbp_to_usd_rate: 1.27

  # CRM_CUSTOMERS.country renders the United States inconsistently
  # (docs/synthetic_data_spec.md, "Dirty country formatting"; confirmed
  # directly against DEV_ANALYTICS.RAW.CRM_CUSTOMERS -- see ADR-006). A
  # handful of fixed string variants, so this is a var, not a seed --
  # EU country codes (DE/FR/NL/ES/IT) are already canonical and are left
  # untouched by crm_standardize_country(). Every variant here collapses
  # to the same canonical value (US), so this is a flat list, not a
  # variant->canonical dict -- if a future country ever needed a
  # different canonical target, this would become a dict at that point.
  crm_us_country_variants: ["US", "USA", "United States", "u.s.a."]

models:
  enterprise_dbt_snowflake_pipeline:
    staging:
      +materialized: view
    intermediate:
      # Ephemeral: these models exist to reshape/union sources for the marts
      # layer, are never queried directly (by BI tools or ad hoc analysts),
      # and this project's schemas are already ephemeral per PR (see
      # docs/workflow.md) — giving intermediate its own persisted object per
      # PR schema would just be extra Snowflake objects with no consumer.
      # Revisit if an intermediate model ever needs to be tested/debugged
      # in isolation via `dbt show`, where a table materialization is easier
      # to inspect.
      +materialized: ephemeral
    marts:
      +materialized: table
