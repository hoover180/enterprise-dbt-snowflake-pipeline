version: 2

sources:
  - name: web
    schema: RAW
    description: >
      Web clickstream extract loaded by data_gen/load_raw.py. Lands as a
      single VARIANT column (event_data) -- see docs/synthetic_data_spec.md,
      "Web clickstream source", for the full event shape and injected
      messiness (mid-year user_email -> customer_global_email schema
      drift, sparse/tiered-dirty identity capture -- ADR-008 in
      docs/data_modeling_decisions.md, ~5% web-pixel retry duplicate
      events, late-arriving events).

      No `database:` is set here (see ADR-007 in
      docs/data_modeling_decisions.md) -- omitting it lets dbt default to
      target.database, matching the erp/crm sources' fix for the same
      environment-promotion issue.
    tables:
      - name: raw_web_events
        identifier: RAW_WEB_EVENTS
        description: >
          Newline-delimited JSON clickstream events at event grain, loaded
          into a single VARIANT column. Covers page_view, cart_addition,
          search_query, and purchase (ADR-009 in
          docs/data_modeling_decisions.md) event types.

          Freshness is keyed on Snowflake's warehouse-metadata LAST_ALTERED
          (no loaded_at_field configured), matching the erp/crm sources --
          not on ingested_at. ingested_at is synthetic business data
          (data_gen/clickstream.py's simulated pipeline-arrival timestamp
          for the late-arrival demo, ADR-004/ADR-005), not a record of when
          Snowflake actually loaded the row; a field being named like a
          timestamp doesn't make it a valid freshness signal, and this PR's
          fix (ADR-007) corrects that category error. data_gen/load_raw.py
          does a full CREATE OR REPLACE TABLE on this table on every run,
          same as the CSV sources, so LAST_ALTERED exactly equals the last
          load time. "Stale" means this table hasn't been reloaded within
          the assumed batch cadence; warn after 24 hours, error after 48
          hours -- the same cadence assumption as the erp/crm sources (see
          ADR-007).

          ingested_at itself is untouched by this change and still drives
          stg_web__events' late-arrival logic and
          int_web_events_incremental's lookback window (ADR-004/ADR-005) --
          only its use for source freshness was removed.
        config:
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}
        columns:
          - name: event_data
            description: >
              Raw event payload. Common fields: event_id, event_timestamp,
              event_date, ingested_at, session_id, event_type, and,
              on the minority of rows where a web pixel actually captured
              an identity signal (see ADR-008), at most one of user_email
              (events before 2025-07-01) / customer_global_email (events on
              or after) -- both keys are absent on an anonymous/uncaptured
              event. Type-specific fields: page_url (page_view),
              product_id/quantity (cart_addition), search_query
              (search_query), transaction_id/checkout_total/currency
              (purchase -- ADR-009 in docs/data_modeling_decisions.md).
