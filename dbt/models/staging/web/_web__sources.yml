version: 2

sources:
  - name: web
    database: DEV_ANALYTICS
    schema: RAW
    description: >
      Web clickstream extract loaded by data_gen/load_raw.py. Lands as a
      single VARIANT column (event_data) -- see docs/synthetic_data_spec.md,
      "Web clickstream source", for the full event shape and injected
      messiness (mid-year user_id -> customer_global_id schema drift, ~5%
      web-pixel retry duplicate events, late-arriving events).
    tables:
      - name: raw_web_events
        identifier: RAW_WEB_EVENTS
        description: >
          Newline-delimited JSON clickstream events at event grain, loaded
          into a single VARIANT column. Covers page_view, cart_addition,
          and search_query event types.
        columns:
          - name: event_data
            description: >
              Raw event payload. Common fields: event_id, event_timestamp,
              event_date, ingested_at, session_id, event_type, and exactly
              one of user_id (events before 2025-07-01) / customer_global_id
              (events on or after). Type-specific fields: page_url
              (page_view), product_id/quantity (cart_addition),
              search_query (search_query).
