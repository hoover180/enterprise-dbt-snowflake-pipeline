version: 2

sources:
  - name: web
    schema: RAW
    description: >
      Web clickstream extract loaded by data_gen/load_raw.py. Lands as a
      single VARIANT column (event_data) -- see docs/synthetic_data_spec.md,
      "Web clickstream source", for the full event shape and injected
      messiness (mid-year user_id -> customer_global_id schema drift, ~5%
      web-pixel retry duplicate events, late-arriving events).

      No `database:` is set here (see ADR-007 in
      docs/data_modeling_decisions.md) -- omitting it lets dbt default to
      target.database, matching the erp/crm sources' fix for the same
      environment-promotion issue.
    tables:
      - name: raw_web_events
        identifier: RAW_WEB_EVENTS
        description: >
          Newline-delimited JSON clickstream events at event grain, loaded
          into a single VARIANT column. Covers page_view, cart_addition,
          and search_query event types.

          Freshness is keyed on ingested_at (pipeline arrival time), not
          event_timestamp (when the click actually happened) -- this
          source is the one place in this project that already names that
          distinction explicitly (ADR-004/ADR-005): event_timestamp can be
          arbitrarily old (a legitimately late-arriving event), so it says
          nothing about whether the table itself was recently loaded,
          which is what freshness is actually meant to catch. loaded_at_field
          is the VARIANT expression `event_data:ingested_at::timestamp_tz`
          (dbt supports a SQL expression here, not only a bare column
          name), matching web_events_parsed()'s own cast. "Stale" means no
          event with a recent ingested_at has landed; warn after 24 hours,
          error after 48 hours -- the same cadence assumption as the
          erp/crm sources (see ADR-007), not a threshold padded for the
          ~2% of events that are legitimately 2-4 days late (ADR-004/005):
          that lag affects individual rows' ingested_at relative to their
          own event_timestamp, not how recent the table's *most recently
          ingested* row is, which is what this check actually measures.

          Known consequence, documented rather than hidden: this project's
          synthetic data pins ingested_at to a fixed historical window
          (2025-01-05 to 2025-12-31, matching erp.py/crm.py's own
          AS_OF_DATE determinism fix) instead of wall-clock "now". Run
          against real wall-clock time, this freshness check will
          therefore always report error, no matter how recently
          data_gen/load_raw.py was actually last run -- a property of the
          static synthetic dataset never advancing its embedded
          timestamps, not a misconfigured check. See ADR-007.
        config:
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}
          loaded_at_field: event_data:ingested_at::timestamp_tz
        columns:
          - name: event_data
            description: >
              Raw event payload. Common fields: event_id, event_timestamp,
              event_date, ingested_at, session_id, event_type, and exactly
              one of user_id (events before 2025-07-01) / customer_global_id
              (events on or after). Type-specific fields: page_url
              (page_view), product_id/quantity (cart_addition),
              search_query (search_query).
