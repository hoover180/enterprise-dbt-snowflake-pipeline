version: 2

models:
  - name: stg_erp__order_items
    description: >
      Canonical, order-item-grain view of the US and EU ERP shards, unioned
      and standardized via the erp_order_items_unioned() macro. Monetary
      fields are converted to USD using the synthetic erp_eur_to_usd_rate
      var (see dbt_project.yml and ADR-002 in
      docs/data_modeling_decisions.md) -- not a production FX rate. Rows
      that fail basic row-level validation are excluded here and routed to
      stg_erp__order_items_quarantine instead. order_id alone is
      intentionally non-unique at this grain; the business key is
      (region, source_order_id, source_line_item_id), exposed as
      order_item_key.
    columns:
      - name: order_item_key
        description: >
          Surrogate key over the composite business key (region,
          source_order_id, source_line_item_id) at order-item grain --
          generated via dbt_utils.generate_surrogate_key() (see ADR-007 in
          docs/data_modeling_decisions.md). An md5 hash, not a readable
          delimited string; nothing in this project parses its value, only
          its uniqueness.
        data_tests:
          - unique
          - not_null
      - name: region
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["US", "EU"]
      - name: source_order_id
        description: Native order identifier (order_id for US, order_no for EU). Intentionally non-unique alone -- repeats once per item on the order.
        data_tests:
          - not_null
      - name: source_line_item_id
        data_tests:
          - not_null
      - name: customer_id
        description: Native customer identifier, preserved as-is (CUST-##### for US, EU-CLI-###### for EU). No cross-shard identity resolution at this layer.
        data_tests:
          - not_null
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["shipped", "delivered"]
      - name: unit_price_usd
        description: unit_price_original converted to USD via erp_convert_to_usd(). Never null for rows that pass validation.
        data_tests:
          - not_null
      - name: tax_amount_usd
        data_tests:
          - not_null

  - name: stg_erp__orders
    description: >
      Canonical, order-grain view of the US and EU ERP shards, built via
      erp_orders_unioned() (order-grain counterpart to
      erp_order_items_unioned()). One row per (region, order_id) --
      order_status and customer_id are confirmed identical across every
      line item of a given order (see ADR-002 in
      docs/data_modeling_decisions.md), so no line-item information is lost
      by collapsing to this grain. Separate from stg_erp__order_items
      (order-item grain, Issue #16) -- this model exists to support Issue
      #17's SCD2 snapshot of order_status. No currency conversion or
      quarantine routing at this grain: monetary fields don't exist here,
      and every row that appears in the raw shards has a valid order_id/
      customer_id/order_status by construction (see docs/synthetic_data_spec.md,
      "Deliberate non-messiness").
    columns:
      - name: order_key
        description: >
          Surrogate key over the composite business key (region, order_id)
          at order grain -- generated via dbt_utils.generate_surrogate_key(),
          matching stg_erp__order_items.order_item_key's convention (see
          ADR-007). Not the same value the snapshot's own unique_key config
          uses -- erp_orders_status_snapshot.yml lists [region, order_id]
          directly (see ADR-003).
        data_tests:
          - unique
          - not_null
      - name: region
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["US", "EU"]
      - name: order_id
        description: Native order identifier (order_id for US, order_no for EU).
        data_tests:
          - not_null
      - name: customer_id
        description: Native customer identifier, preserved as-is (CUST-##### for US, EU-CLI-###### for EU).
        data_tests:
          - not_null
      - name: order_status
        description: Canonicalized column name across the two shards' different naming (order_status / fulfillment_state).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["shipped", "delivered"]
      - name: order_date
        data_tests:
          - not_null

  - name: stg_erp__order_items_quarantine
    description: >
      Rows from the US/EU ERP union that failed basic row-level validation
      (missing business key, missing required field, or a currency with no
      defined USD conversion rate -- see erp_quarantine_reason() macro).
      Minimal by design: no retry counts, replay orchestration, or
      resolved-status tracking (Phase 6).
    columns:
      - name: quarantine_reason
        data_tests:
          - not_null
      - name: quarantined_at
        data_tests:
          - not_null
